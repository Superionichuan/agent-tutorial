name: CI

# Tests on Linux, macOS and Windows; the one-line install scripts on fresh machines;
# on a version tag (v*), a GitHub release with the wheel that the install scripts download.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package and pytest
        run: python -m pip install ".[ui]" pytest
      - name: Run the tests (each failure becomes an annotation on the run's page)
        run: python .github/scripts/pytest_annotate.py -q -rf -p no:cacheprovider tests

  build:
    name: wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: The version is the same everywhere
        run: python .github/scripts/check_versions.py
      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir wheelhouse
      - uses: actions/upload-artifact@v7
        with:
          name: wheel
          path: wheelhouse/*.whl
          if-no-files-found: error

  install:
    name: install script (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MINI_AGENT_NO_SETUP: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: wheel
          path: wheelhouse

      - name: Install with install.sh, as `curl ... | sh` runs it
        if: runner.os != 'Windows'
        shell: bash
        run: |
          wheel="$(ls "$PWD"/wheelhouse/*.whl)"
          echo "uv before the script: $(command -v uv || echo none)"
          MINI_AGENT_SPEC="mini_agent[ui] @ file://$wheel" sh install.sh < /dev/null

      - name: Install with install.ps1, as the one-line command runs it (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem wheelhouse\*.whl).FullName
          $env:MINI_AGENT_SPEC = "mini_agent[ui] @ file:///$($wheel -replace '\\', '/')"
          Write-Host "uv before the script: $((Get-Command uv -ErrorAction SilentlyContinue).Source)"
          powershell -NoProfile -ExecutionPolicy ByPass -c "Get-Content -Raw install.ps1 | Invoke-Expression"
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 failed (exit $LASTEXITCODE)" }

      - name: The command works (version, doctor, a task in offline mode)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          uv_exe="$(command -v uv || echo "$HOME/.local/bin/uv")"
          bin="$("$uv_exe" tool dir --bin)"
          "$bin/mini_agent" --version
          "$bin/mini_agent" doctor
          cd "$RUNNER_TEMP"
          out="$("$bin/mini_agent" --backend offline "Compute 3**7." < /dev/null)"
          printf '%s\n' "$out" | tail -n 3
          printf '%s\n' "$out" | grep -q "Answer: 2187"

      - name: The command works (version, doctor, a task in offline mode)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $uv = (Get-Command uv -ErrorAction SilentlyContinue).Source
          if (-not $uv) { $uv = Join-Path $HOME '.local\bin\uv.exe' }
          $bin = ([string](& $uv tool dir --bin)).Trim()
          $exe = Join-Path $bin 'mini_agent.exe'
          & $exe --version
          & $exe doctor
          if ($LASTEXITCODE -ne 0) { throw 'mini_agent doctor failed' }
          Set-Location $env:RUNNER_TEMP
          $out = & $exe --backend offline "Compute 3**7." | Out-String
          ($out.Trim() -split "`n") | Select-Object -Last 3
          if ($out -notmatch 'Answer: 2187') { throw 'the offline task did not answer 2187' }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (($userPath -split ';') -notcontains $bin) { throw "$bin is not on the user PATH" }

  release:
    name: GitHub release (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wheel
          path: wheelhouse
      - name: Create the release, with the wheel the install scripts download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >
          gh release create "$GITHUB_REF_NAME" wheelhouse/*.whl
          --title "mini_agent ${GITHUB_REF_NAME#v}"
          --notes "Install with one command: see Install in the README."
