name: CI

# Tests on Linux, macOS and Windows; the one-line install scripts on fresh machines;
# on a version tag (v*), a GitHub release with the wheel that the install scripts download
# (a pre-release for a preview version such as 2.0.0.dev0 or 2.0.0rc1).

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package and pytest
        run: python -m pip install ".[ui]" pytest
      - name: Run the tests (each failure becomes an annotation on the run's page)
        run: python .github/scripts/pytest_annotate.py -q -rf -p no:cacheprovider tests

  build:
    name: wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: The version is the same everywhere
        run: python .github/scripts/check_versions.py
      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir wheelhouse
      - uses: actions/upload-artifact@v7
        with:
          name: wheel
          path: wheelhouse/*.whl
          if-no-files-found: error

  install:
    name: install script (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MINI_AGENT_NO_SETUP: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: wheel
          path: wheelhouse

      - name: Install with install.sh, as `curl ... | sh` runs it
        if: runner.os != 'Windows'
        shell: bash
        run: |
          wheel="$(ls "$PWD"/wheelhouse/*.whl)"
          echo "uv before the script: $(command -v uv || echo none)"
          MINI_AGENT_SPEC="mini_agent[ui] @ file://$wheel" sh install.sh < /dev/null

      - name: Install with install.ps1, as the one-line command runs it (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem wheelhouse\*.whl).FullName
          $env:MINI_AGENT_SPEC = "mini_agent[ui] @ file:///$($wheel -replace '\\', '/')"
          Write-Host "uv before the script: $((Get-Command uv -ErrorAction SilentlyContinue).Source)"
          powershell -NoProfile -ExecutionPolicy ByPass -c "Get-Content -Raw install.ps1 | Invoke-Expression"
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 failed (exit $LASTEXITCODE)" }

      - name: The command works (version, doctor, a task in offline mode)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          uv_exe="$(command -v uv || echo "$HOME/.local/bin/uv")"
          bin="$("$uv_exe" tool dir --bin)"
          "$bin/mini_agent" --version
          "$bin/mini_agent" doctor
          cd "$RUNNER_TEMP"
          out="$("$bin/mini_agent" --backend offline "Compute 3**7." < /dev/null)"
          printf '%s\n' "$out" | tail -n 3
          printf '%s\n' "$out" | grep -q "Answer: 2187"

      - name: The command works (version, doctor, a task in offline mode)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $uv = (Get-Command uv -ErrorAction SilentlyContinue).Source
          if (-not $uv) { $uv = Join-Path $HOME '.local\bin\uv.exe' }
          $bin = ([string](& $uv tool dir --bin)).Trim()
          $exe = Join-Path $bin 'mini_agent.exe'
          & $exe --version
          & $exe doctor
          if ($LASTEXITCODE -ne 0) { throw 'mini_agent doctor failed' }
          Set-Location $env:RUNNER_TEMP
          $out = & $exe --backend offline "Compute 3**7." | Out-String
          ($out.Trim() -split "`n") | Select-Object -Last 3
          if ($out -notmatch 'Answer: 2187') { throw 'the offline task did not answer 2187' }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (($userPath -split ';') -notcontains $bin) { throw "$bin is not on the user PATH" }

      - name: The README's Python line works; a second run of the installer keeps the settings
        if: runner.os != 'Windows'
        shell: bash
        run: |
          uv_exe="$(command -v uv || echo "$HOME/.local/bin/uv")"
          "$("$uv_exe" tool dir)/mini-agent/bin/python" -c "import mini_agent; from mini_agent import Agent, tool; print('import ok', mini_agent.__version__)"
          mkdir -p "$HOME/.mini_agent" && printf 'LLM_BACKEND=offline\n' > "$HOME/.mini_agent/config.env"
          wheel="$(ls "$PWD"/wheelhouse/*.whl)"
          out="$(MINI_AGENT_SPEC="mini_agent[ui] @ file://$wheel" sh install.sh < /dev/null)"
          printf '%s\n' "$out" | tail -n 4
          printf '%s\n' "$out" | grep -qF 'Your settings are kept; `mini_agent setup` changes them.'
          grep -qx 'LLM_BACKEND=offline' "$HOME/.mini_agent/config.env"

      - name: The README's Python line works; a second run of the installer keeps the settings
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $uv = (Get-Command uv -ErrorAction SilentlyContinue).Source
          if (-not $uv) { $uv = Join-Path $HOME '.local\bin\uv.exe' }
          & "$(& $uv tool dir)\mini-agent\Scripts\python.exe" -c "import mini_agent; from mini_agent import Agent, tool; print('import ok', mini_agent.__version__)"
          if ($LASTEXITCODE -ne 0) { throw 'the README Python line failed' }
          New-Item -ItemType Directory -Force -Path (Join-Path $HOME '.mini_agent') | Out-Null
          Set-Content -Path (Join-Path $HOME '.mini_agent\config.env') -Value 'LLM_BACKEND=offline'
          $wheel = (Get-ChildItem wheelhouse\*.whl).FullName
          $env:MINI_AGENT_SPEC = "mini_agent[ui] @ file:///$($wheel -replace '\\', '/')"
          $out = powershell -NoProfile -ExecutionPolicy ByPass -c "Get-Content -Raw install.ps1 | Invoke-Expression" *>&1 | Out-String
          ($out.Trim() -split "`n") | Select-Object -Last 4
          if ($out -notmatch 'Your settings are kept') { throw 'the second run did not keep the settings' }
          if ((Get-Content (Join-Path $HOME '.mini_agent\config.env') -Raw).Trim() -ne 'LLM_BACKEND=offline') { throw 'config.env changed' }

  release:
    # On a version tag (v*): the GitHub release. On a push of the branch release-dryrun, or run by
    # hand: the same steps with a draft release (visible only to collaborators), checked for its
    # one wheel and deleted again, so the release steps can be proved without publishing.
    name: GitHub release (tags; a draft dry run on release-dryrun or by hand)
    if: >-
      startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release-dryrun'
      || github.event_name == 'workflow_dispatch'
    needs: [test, install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # checkout first: it empties a workspace that has no git repository, which would delete
      # a wheel downloaded before it
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/release-notes
      - uses: actions/download-artifact@v8
        with:
          name: wheel
          path: wheelhouse
      - name: The wheel is there
        run: ls -l wheelhouse/*.whl
      - name: Create the release (on a tag), or a draft that is checked and deleted (dry run)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          wheels=(wheelhouse/*.whl)
          if [ "${#wheels[@]}" -ne 1 ] || [ ! -f "${wheels[0]}" ]; then
            echo "::error::expected one wheel in wheelhouse/, found: ${wheels[*]}"
            exit 1
          fi
          wheel="${wheels[0]}"
          wheel_version="$(basename "$wheel" | cut -d- -f2)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
            draft=()
            if [ "$version" != "$wheel_version" ]; then
              echo "::error::the tag is $tag but the wheel is version $wheel_version"
              exit 1
            fi
          else
            version="$wheel_version"
            tag="v$version-dryrun-$GITHUB_RUN_ID"
            draft=(--draft --target "$GITHUB_SHA")
          fi
          options=()
          # A version with a pre-release or dev part (2.0.0.dev0, 2.0.0a1, 2.0.0b1, 2.0.0rc1) is a
          # preview: a GitHub pre-release, which is never shown as the latest release.
          if printf '%s\n' "$version" | grep -Eq '(a|b|rc)[0-9]+(\.dev[0-9]*)?$|\.?dev[0-9]*$'; then
            options+=(--prerelease)
          fi
          notes=".github/release-notes/v$version.md"
          if [ -f "$notes" ]; then
            options+=(--notes-file "$notes")
          else
            options+=(--notes "Install with one command: see Install on your computer in the README.")
          fi
          gh release create "$tag" "$wheel" --title "mini_agent $version" "${draft[@]}" "${options[@]}"
          if [ "${#draft[@]}" -gt 0 ]; then
            assets="$(gh release view "$tag" --json assets --jq '[.assets[].name] | join(",")')"
            notes_used="$(gh release view "$tag" --json body --jq '.body | split("\n")[0]')"
            gh release delete "$tag" --yes
            if [ "$assets" != "mini_agent-$version-py3-none-any.whl" ]; then
              echo "::error::the draft release carried: ${assets:-nothing}"
              exit 1
            fi
            pre=no
            if [[ " ${options[*]} " == *" --prerelease "* ]]; then pre=yes; fi
            echo "::notice title=Release dry run::draft $tag carried $assets; pre-release: $pre; notes begin: $notes_used; the draft was deleted"
          fi
