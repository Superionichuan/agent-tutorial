[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mini_agent"
version = "0.1.0"
description = "Minimal AI Agent Framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.24.0",
    "rich>=13.0",
    "textual>=0.80",
    "openai>=1.0",
    "anthropic>=0.30",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
mini_agent = "mini_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mini_agent*"]
